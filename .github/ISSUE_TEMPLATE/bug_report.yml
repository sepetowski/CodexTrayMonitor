name: Bug report
description: Report a reproducible problem without sharing private session logs.
body:
  - type: input
    id: version
    attributes:
      label: Application version and download type
      placeholder: 1.0.0, Setup or Portable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows version, display scaling and monitor setup
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
      description: Do not attach auth.json, real session logs, prompts, tokens or personal paths. Use synthetic examples.
    validations:
      required: true
