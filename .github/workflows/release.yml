name: Build standalone EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build source
        run: dotnet build CodexTrayMonitor.slnx -c Release
      - name: Verify source
        run: dotnet test CodexTrayMonitor.slnx -c Release --no-build
      - name: Publish app
        run: dotnet publish src/CodexTrayMonitor/CodexTrayMonitor.csproj -p:PublishProfile=win-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-exe
          path: |
            artifacts/publish/win-x64/CodexTrayMonitor.exe
            LICENSE
            licenses/H.NotifyIcon-2.4.1.txt
          if-no-files-found: error
          retention-days: 30
